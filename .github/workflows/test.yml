name: Python Tests

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install dependencies using the path to the nested requirements file
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r campus_agent/requirements.txt

      # Run pytest pointing directly to the campus_agent folder
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest campus_agent/ -v
